<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>InLine Padel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Armá tu partido de pádel y reservá la cancha en el mismo paso.">
  <meta name="theme-color" content="#1d4e9e">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var q = window.matchMedia('(prefers-color-scheme: dark)');
      var set = function () { document.documentElement.setAttribute('data-bs-theme', q.matches ? 'dark' : 'light'); };
      set();
      if (q.addEventListener) q.addEventListener('change', set);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
