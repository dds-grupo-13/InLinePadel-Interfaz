x-backend-env: &backend-env
    DEBUG: "0"
    SECRET_KEY: ${SECRET_KEY:-solo-para-desarrollo-local-cambiar}
    ALLOWED_HOSTS: localhost,127.0.0.1
    DB_NAME: ${DB_NAME:-inline_padel_db}
    DB_USER: ${DB_USER:-inline}
    DB_PASSWORD: ${DB_PASSWORD:-inline_local}
    DB_HOST: db
    DB_PORT: "5432"
    CORS_ALLOWED_ORIGINS: http://localhost:4200

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-inline_padel_db}
      POSTGRES_USER: ${DB_USER:-inline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inline_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ../InLinePadel
    image: inlinepadel-backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ../InLinePadel
    image: inlinepadel-backend
    environment: *backend-env
    command: sh -c "while true; do python manage.py vencer_lobbies; sleep 60; done"
    depends_on:
      - app
    restart: unless-stopped

  web:
    build:
      context: ./inlinepadel
      args:
        API_URL: http://localhost:8000/api
    ports:
      - "4200:80"
    depends_on:
      - app

volumes:
  pgdata:
